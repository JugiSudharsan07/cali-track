<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaliTrack</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 40px 24px;
      max-width: 400px;
      width: 100%;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.2em;
      color: #888;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .headline {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .headline span {
      color: #c8f135;
    }

    .subtext {
      font-size: 16px;
      color: #888;
      line-height: 1.6;
      margin-bottom: 48px;
    }

    .start-btn {
      background: #c8f135;
      color: #0a0a0a;
      border: none;
      padding: 16px 40px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: transform 0.1s, opacity 0.1s;
      width: 100%;
      max-width: 280px;
    }

    .start-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .tagline {
      margin-top: 24px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="logo">CaliTrack</div>
    <h1 class="headline">Train smart.<br><span>Progress automatically.</span></h1>
    <p class="subtext">No planning. No guessing. Just show up and the app handles the rest.</p>
    <button class="start-btn" onclick="alert('Coming soon!')">Get Started</button>
    <p class="tagline">Free. No equipment needed to start.</p>
  </div>

</body>
</html>
