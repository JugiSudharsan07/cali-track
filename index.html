<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CaliTrack</title>
  <style>
    body { background: #0a0a0a; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    #debug-msg { color: #555; text-align: center; }
  </style>
</head>
<body>
  <div id="debug-msg"><h1>CaliTrack</h1><p>Initializing...</p></div>
  <script>
    console.log("Script starting...");
    const deviceId = localStorage.getItem('calitrack_device_id');
    console.log("Device ID found:", deviceId);
    
    if (!deviceId) {
      document.getElementById('debug-msg').innerHTML = "<h1>No User Data</h1><p>Please complete onboarding.</p>";
    } else {
      document.getElementById('debug-msg').innerHTML = "<h1>Data Found</h1><p>ID: " + deviceId + "</p>";
    }
  </script>
</body>
</html>
